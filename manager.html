<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KickAbout — Manager Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/manager.css">
</head>

<body>

  <!-- Top ribbon / header (copied from index.html) -->
  <header class="topbar">
    <div class="bar">
      <a href="index.html" class="logo">
        <img src="img/kickabout-shield.svg" alt="KickAbout logo" class="logo-icon">
        <div class="logo-text">
          <span class="kick">Kick</span><span class="about">About</span>
        </div>
      </a>

      <button id="accountBtn" class="account-chip" type="button">
        <span class="coin">🪙</span>
        <span id="coinCount">1,450</span>
        <span class="divider">|</span>
        <span id="accountName">Guest</span>
        <span class="caret">▾</span>
      </button>
    </div>

    <nav class="nav">
      <a class="nav-btn" href="index.html">Home</a>
      <a class="nav-btn" href="index.html#players">Players</a>
      <a class="nav-btn" href="index.html#draft">Draft Mode</a>
      <a class="nav-btn" href="index.html#tournament">Tournament</a>

      <div class="nav-dropdown">
        <button class="nav-btn nav-drop-btn" id="navMinigames" type="button">
          Minigames ▾
        </button>
        <div class="nav-drop-menu hidden" id="navMinigamesMenu">
          <a class="nav-drop-item" href="#" data-soon="true">Start one bench one sell one</a>
          <a class="nav-drop-item" href="#" data-soon="true">Missing XI</a>
          <a class="nav-drop-item" href="#" data-soon="true">Keep 3 Lose 1</a>
          <a class="nav-drop-item" href="#" data-soon="true">Fixture Rebuilder</a>
          <a class="nav-drop-item" href="#" data-soon="true">Winner stays on</a>
          <a class="nav-drop-item" href="#" data-soon="true">Who am I?</a>
          <a class="nav-drop-item" href="#" data-soon="true">Best XI</a>
          <a class="nav-drop-item" href="#" data-soon="true">Fantasy Football</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
  <section class="manager-page">
    <div class="manager-shell card">
      <div class="manager-head">
        <div>
          <h1 class="manager-title">Manager Mode</h1>
          <p class="manager-sub">Choose your challenge.</p>
        </div>

        <a class="manager-back" href="index.html">← Back</a>
      </div>

      <div class="diff-grid">
        <button class="diff-card diff-easy" data-diff="easy" type="button">
          <div class="diff-top">
            <span class="diff-name">Easy</span>
          </div>

          <div class="diff-stats">
            <div class="diff-row"><span>Transfer</span><strong>£1,200,000,000</strong></div>
            <div class="diff-row"><span>Wages</span><strong>£3,000,000 / week</strong></div>
            <div class="diff-row"><span>Options</span><strong>8 per position</strong></div>
            <div class="diff-row"><span>Squad</span><strong>15 players</strong></div>
          </div>

          <div class="diff-cta">Start Easy</div>
        </button>

        <button class="diff-card diff-medium" data-diff="medium" type="button">
          <div class="diff-top">
            <span class="diff-name">Medium</span>
          </div>

          <div class="diff-stats">
            <div class="diff-row"><span>Transfer</span><strong>£750,000,000</strong></div>
            <div class="diff-row"><span>Wages</span><strong>£1,800,000 / week</strong></div>
            <div class="diff-row"><span>Options</span><strong>5 per position</strong></div>
            <div class="diff-row"><span>Squad</span><strong>15 players</strong></div>
          </div>

          <div class="diff-cta">Start Medium</div>
        </button>

        <button class="diff-card diff-hard" data-diff="hard" type="button">
          <div class="diff-top">
            <span class="diff-name">Hard</span>
          </div>

          <div class="diff-stats">
            <div class="diff-row"><span>Transfer</span><strong>£450,000,000</strong></div>
            <div class="diff-row"><span>Wages</span><strong>£1,200,000 / week</strong></div>
            <div class="diff-row"><span>Options</span><strong>3 per position</strong></div>
            <div class="diff-row"><span>Squad</span><strong>15 players</strong></div>
          </div>

          <div class="diff-cta">Start Hard</div>
        </button>
      </div>
    </div>
  </section>
</main>

  <script type="module" src="js/manager.js"></script>
</body>
</html>
